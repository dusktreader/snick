[project]
name = "snick-docs"
version = "0.1.0"
description = "Documentation site for snick"
requires-python = ">=3.10"
dependencies = [
    "snick",
]

[dependency-groups]
dev = [
    "mkdocstrings[python]>=0.27",
    "pygments~=2.19",
    "zensical~=0.0.33",
]

[tool.uv]
package = false

[tool.uv.sources]
snick = { path = "..", editable = true }
